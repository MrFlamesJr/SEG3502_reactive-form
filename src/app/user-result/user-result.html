<div class="screen">
  <app-binary-rain />

  <div class="panel">
    <h1 class="title">&gt; RESULT<span class="cursor">_</span></h1>

    @if (user) {
      <table class="table">
        <tbody>
          <tr>
            <th>First Name</th>
            <td>{{ user.firstName }}</td>
          </tr>
          <tr>
            <th>Last Name</th>
            <td>{{ user.lastName }}</td>
          </tr>
          <tr>
            <th>Phone</th>
            <td>{{ user.phone || 'Not Provided' }}</td>
          </tr>
          <tr>
            <th>Email</th>
            <td>{{ user.email || 'Not Provided' }}</td>
          </tr>
        </tbody>
      </table>
    } @else {
      <p>No user information has been submitted.</p>
    }

    <a class="back-link" routerLink="/form">Return to form</a>
  </div>
</div>
